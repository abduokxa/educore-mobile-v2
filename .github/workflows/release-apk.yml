name: Release APK

# Builds the production Android APK signed with the permanent release keystore, checks the signature with apksigner,
# and publishes the APK with its SHA-256 checksum. Run it from the Actions tab (Run workflow), or push a tag like v2.0.0.
# Needs four repository secrets (see README, "Signed release APK"): RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD. It never signs with a debug key: without them it stops.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    env:
      # Secrets are only ever passed through the environment, so they are masked in the logs.
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Release keystore from secrets
        run: |
          for v in RELEASE_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret for $v is not set. See README, Signed release APK."; exit 1; fi
          done
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/educore-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/educore-release.jks" >> "$GITHUB_ENV"

      - name: Build
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Verify the signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/verify.txt"
          grep -q "Verifies" "$RUNNER_TEMP/verify.txt" || { echo "::error::apksigner did not verify the APK"; exit 1; }
          # A debug-signed file must never get through.
          if grep -qi "CN=Android Debug" "$RUNNER_TEMP/verify.txt"; then echo "::error::The APK is signed with the Android debug key"; exit 1; fi

      - name: Checksum and details
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk | tee app-release.apk.sha256
          BADGING=$("$AAPT" dump badging app-release.apk | head -1)
          {
            echo "### Signed release APK"
            echo "- Size: $(du -h app-release.apk | cut -f1) ($(stat -c %s app-release.apk) bytes)"
            echo "- Package: $(echo "$BADGING" | sed -n "s/.*name='\([^']*\)'.*/\1/p")"
            echo "- Version: $(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p") (build $(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p"))"
            echo "- SHA-256 of the file: \`$(cut -d' ' -f1 app-release.apk.sha256)\`"
            echo "- Signing certificate SHA-256: \`$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/verify.txt" | sed 's/.*: //')\`"
            echo "- Signature: verified by apksigner"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: educore-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/educore-release.jks"
