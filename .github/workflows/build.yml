name: Build

# Checks every push, and builds the Android app (an APK to install, and an AAB for Google Play) on a GitHub machine,
# so no paid build service is needed. Download the files from the run's "Artifacts".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ROOT_DOMAIN: edu-core.ng

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: check
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Signing: add the four secrets below (and ANDROID_KEYSTORE_BASE64, your upload keystore, base64 encoded)
      # to sign with your own key. Without them the build is signed with a debug key: fine for testing, not for the store.
      - name: Prepare signing key
        if: ${{ env.HAS_KEY == 'true' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build
        env:
          KEYSTORE_FILE: ${{ env.HAS_KEY == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -z "$KEYSTORE_FILE" ] && unset KEYSTORE_FILE
          flutter build apk --release --dart-define=ROOT_DOMAIN=$ROOT_DOMAIN
          flutter build appbundle --release --dart-define=ROOT_DOMAIN=$ROOT_DOMAIN
      - uses: actions/upload-artifact@v4
        with:
          name: educore-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
